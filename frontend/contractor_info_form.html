<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>विद्युत ठेकेदार लायसन्स नुतनीकरणा करीता आवश्यक माहिती</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pdf-form/pdf-form.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #e9ecef; font-family: Arial, "Noto Sans Devanagari", sans-serif; }
        .top-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
                   background: #fff; padding: 12px 16px; border-bottom: 1px solid #dde3ea; }
        .top-bar h1 { font-size: 1.05rem; margin: 0; line-height: 1.4; }
        .top-bar h1 small { display: block; font-size: 0.8rem; font-weight: normal; color: #556; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn { padding: 9px 18px; border: none; border-radius: 6px; font-size: 0.92rem; font-weight: bold; cursor: pointer; font-family: inherit; }
        .btn:hover { opacity: 0.88; }
        .btn:disabled { opacity: 0.6; cursor: wait; }
        .btn-back { background: #6c757d; color: #fff; }
        .btn-preview { background: #fff; color: #0056b3; border: 1.5px solid #0056b3; }
        .btn-submit { background: #28a745; color: #fff; }
        .help { max-width: 900px; margin: 10px auto 0; padding: 0 12px; font-size: 0.85rem; color: #445; line-height: 1.5; }
        .help span { display: inline-block; padding: 0 6px; border-radius: 3px; }
        #loading { text-align: center; padding: 60px 16px; color: #345; }
        .bottom-actions { display: flex; justify-content: center; gap: 12px; padding: 8px 16px 40px; flex-wrap: wrap; }
        /* keep the language button clear of the sticky page tabs */
        #global-lang-toggle { top: auto !important; bottom: 16px; right: 16px; }
        @media (max-width: 640px) { .top-bar h1 { font-size: 0.95rem; } .btn { padding: 8px 12px; font-size: 0.85rem; } }

        /* ── Extra fields panel ── */
        #extra-fields-panel {
            max-width: 900px; margin: 12px auto 0; padding: 0 12px;
        }
        .extra-fields-card {
            background: #fff; border: 1.5px solid #c8d6e8; border-radius: 10px;
            padding: 16px 20px; margin-bottom: 4px;
        }
        .extra-fields-card h2 {
            font-size: 0.92rem; font-weight: 700; color: #0056b3;
            margin: 0 0 12px; padding-bottom: 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        .extra-fields-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px 20px;
        }
        .extra-field label {
            display: block; font-size: 0.8rem; color: #445;
            margin-bottom: 4px; font-weight: 600;
        }
        .extra-field input {
            width: 100%; padding: 7px 10px; border: 1.5px solid #bbc8d8;
            border-radius: 5px; font-size: 0.92rem; font-family: inherit;
            background: #f4f8ff; color: #1a2a40; outline: none;
        }
        .extra-field input:focus { border-color: #0056b3; background: #fff; }
    </style>
</head>
<body>
<form id="ContractorInfoFormForm" novalidate>
    <header class="top-bar">
        <h1 data-mr="विद्युत ठेकेदार लायसन्स नुतनीकरणा करीता आवश्यक माहिती" data-en="Information for Contractor License Renewal">विद्युत ठेकेदार लायसन्स नुतनीकरणा करीता आवश्यक माहिती</h1>
        <div class="actions">
            <button type="button" class="btn btn-back" onclick="window.location.href='dashboard.html'" data-mr="← मागे" data-en="← Back">← मागे</button>
            <button type="button" class="btn btn-preview" id="previewPdf" data-mr="PDF पहा" data-en="Preview PDF">PDF पहा</button>
            <button type="submit" class="btn btn-submit" data-mr="सबमिट करा व डाउनलोड" data-en="Submit &amp; Download">सबमिट करा व डाउनलोड</button>
        </div>
    </header>
    <p class="help">
        <span data-mr="मूळ अर्जावरच थेट माहिती भरा. निळ्या जागेत टाइप करा, फोटो/स्वाक्षरीच्या चौकटीवर क्लिक करून चित्र निवडा. एकदा भरलेली माहिती (नाव, संस्था, परवाना…) इतर पानांवर आपोआप भरली जाते (हिरवी) — हवे तर बदला. मराठीत लिहिण्यासाठी 'अ' बटण वापरा."
              data-en="Fill the original form directly. Type in the blue blanks; click a photo/signature box to choose a picture. Details entered once (name, firm, licence…) are filled on the other pages automatically (green) — edit them if needed. Use the 'अ' button to type in Marathi.">मूळ अर्जावरच थेट माहिती भरा.</span>
    </p>

    <!-- Extra fields not present on the info PDF but required in the renewal form -->
    <div id="extra-fields-panel">
        <div class="extra-fields-card">
            <h2 data-mr="अतिरिक्त माहिती (नूतनीकरण फॉर्मसाठी)" data-en="Additional Details (needed for Renewal Form)">अतिरिक्त माहिती (नूतनीकरण फॉर्मसाठी)</h2>
            <div class="extra-fields-grid">
                <div class="extra-field">
                    <label for="ef_owner_mobile"
                           data-mr="मालकाचा मोबाइल क्र."
                           data-en="Owner mobile no.">मालकाचा मोबाइल क्र.</label>
                    <input type="tel" id="ef_owner_mobile"
                           data-autofill-key="owner_mobile"
                           inputmode="numeric" maxlength="15"
                           placeholder="10-digit mobile number"
                           autocomplete="tel">
                </div>
                <div class="extra-field">
                    <label for="ef_owner_age"
                           data-mr="मालकाचे वय (वर्षे)"
                           data-en="Owner age (years)">मालकाचे वय (वर्षे)</label>
                    <input type="number" id="ef_owner_age"
                           data-autofill-key="owner_age"
                           inputmode="numeric" min="18" max="100"
                           placeholder="e.g. 45">
                </div>
                <div class="extra-field">
                    <label for="ef_supervisor_age"
                           data-mr="पर्यवेक्षकाचे वय (वर्षे)"
                           data-en="Supervisor age (years)">पर्यवेक्षकाचे वय (वर्षे)</label>
                    <input type="number" id="ef_supervisor_age"
                           data-autofill-key="supervisor_age"
                           inputmode="numeric" min="18" max="100"
                           placeholder="e.g. 35">
                </div>
            </div>
        </div>
    </div>
    <div id="pdfFormMount"><div id="loading">लोड होत आहे… / Loading…</div></div>
    <div class="bottom-actions">
        <button type="button" class="btn btn-back" onclick="window.location.href='dashboard.html'" data-mr="← मागे" data-en="← Back">← मागे</button>
        <button type="submit" class="btn btn-submit" data-mr="सबमिट करा व डाउनलोड" data-en="Submit &amp; Download">सबमिट करा व डाउनलोड</button>
    </div>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="pdf-form/marathi-translit.js"></script>
<script src="pdf-form/pdf-form-engine.js"></script>
<script>
    (function () {
        const mount = document.getElementById("pdfFormMount");
        const ready = PdfForm.init({
            mount,
            form: document.getElementById("ContractorInfoFormForm"),
            formDir: "pdf-form/forms/contractor_renewal_info/",
        }).then(() => { document.getElementById("loading").remove(); })
          .catch(err => {
              console.error(err);
              document.getElementById("loading").textContent = "फॉर्म लोड झाला नाही. पान रिफ्रेश करा. / Could not load the form. Please refresh.";
          });

        // payment.js uses this instead of a screenshot-style PDF: the original template + values
        window.MyExamBuildPdf = async () => { await ready; return PdfForm.buildPdf(); };

        document.getElementById("previewPdf").addEventListener("click", async (e) => {
            const btn = e.currentTarget;
            btn.disabled = true;
            try {
                const blob = await window.MyExamBuildPdf();
                window.open(URL.createObjectURL(blob), "_blank");
            } catch (err) {
                console.error(err);
                alert("PDF तयार करता आली नाही / Could not create the PDF: " + err.message);
            } finally { btn.disabled = false; }
        });
    })();
</script>
<script src="lang-toggle.js"></script>
<script src="config.js"></script>
<script src="payment.js"></script>
<script src="renewal-autofill.js" data-role="save" data-next="contractor_renewal_form.html"></script>
</body>
</html>
