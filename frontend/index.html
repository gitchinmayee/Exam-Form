<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>Exam Registration Form</h2>
    <form id="examForm">
        <!-- Personal Info -->
        <div class="form-section">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div>

        <!-- Academic Info -->
        <div class="form-section">
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">--Select--</option>
                <option value="BCA">BCA</option>
                <option value="MCA">MCA</option>
                <option value="BSc">B.Sc</option>
                <option value="MSc">M.Sc</option>
            </select>

            <label for="semester">Semester:</label>
            <select id="semester" name="semester" required>
                <option value="">--Select--</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
            </select>
        </div>

        <!-- Exam Mode -->
        <div class="form-section">
            <label>Exam Mode:</label>
            <div class="radio-group">
                <input type="radio" id="online" name="exam_mode" value="Online" required>
                <label for="online">Online</label>
                <input type="radio" id="offline" name="exam_mode" value="Offline">
                <label for="offline">Offline</label>
            </div>
        </div>

        <!-- Subjects -->
        <div class="form-section">
            <label for="subjects">Subjects:</label>
            <select id="subjects" name="subjects" multiple required>
                <option value="Maths">Maths</option>
                <option value="CS">Computer Science</option>
                <option value="Economics">Economics</option>
                <option value="AI">Artificial Intelligence</option>
            </select>
        </div>

        <!-- Buttons -->
        <div class="form-section button-group">
            <button type="button" id="printForm">Print Form</button>
            <button type="submit" id="submitForm">Submit & Send via WhatsApp</button>
        </div>
    </form>

    <!-- WhatsApp Link -->
    <div id="whatsapp-container" class="whatsapp-container"></div>
</div>

<script>
document.getElementById('printForm').addEventListener('click', () => window.print());

document.getElementById('examForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const formData = Object.fromEntries(new FormData(this).entries());
    formData.subjects = Array.from(document.getElementById('subjects').selectedOptions).map(o => o.value);

    try {
        const response = await fetch('http://localhost:3000/submit', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(formData)
        });

        const data = await response.json();
        alert(data.message);

        if (data.whatsappLink) {
            const container = document.getElementById('whatsapp-container');
            container.innerHTML = `
                <a href="${data.whatsappLink}" target="_blank" class="whatsapp-btn">
                    Send via WhatsApp
                </a>
            `;
        }
    } catch (err) {
        alert("Error submitting form!");
        console.error(err);
    }
});
</script>
</body>
</html>
