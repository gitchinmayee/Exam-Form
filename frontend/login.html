<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MyExam Forms</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: #0056b3;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: #28a745; }
    .brand-sub {
      font-size: 0.8rem;
      color: #a0aec0;
      margin-top: 2px;
    }
    h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 5px;
    }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1a202c;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #0056b3; }
    .field-error {
      color: #e53e3e;
      font-size: 0.78rem;
      margin: -12px 0 12px;
      display: none;
    }
    .password-wrapper { position: relative; }
    .password-wrapper input { margin-bottom: 16px; }
    .toggle-pw {
      position: absolute; right: 12px; top: 11px;
      background: none; border: none; cursor: pointer;
      color: #0056b3; font-size: 0.78rem; font-weight: 700;
    }
    .btn-primary {
      width: 100%;
      background: #0056b3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #003d82; }
    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.83rem;
      color: #718096;
    }
    .footer-text a { color: #0056b3; font-weight: 600; text-decoration: none; }
    .lang-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }
    .btn-lang {
      background: none;
      border: 1px solid #cbd5e0;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      color: #555;
      transition: all 0.2s;
    }
    .btn-lang:hover { background: #0056b3; color: #fff; border-color: #0056b3; }
    .divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 20px 0;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-logo">My<span>Exam</span> Forms</div>
    
  </div>

  <div class="lang-row">
    <button class="btn-lang" onclick="toggleLang()" data-i18n="toggle_lang">मराठी</button>
  </div>

  <h2 data-i18n="title_login">Welcome back</h2>
  <p class="subtitle" data-lang-en="Sign in to your account to continue." data-lang-mr="पुढे जाण्यासाठी साइन इन करा.">Sign in to your account to continue.</p>

  <form id="loginForm" novalidate>
    <label for="email" data-i18n="label_email">Email address</label>
    <input type="email" id="email" name="email" placeholder="name@example.com" required>
    <div class="field-error" id="email-error">Please enter a valid email address.</div>

    <label for="password">Password</label>
    <div class="password-wrapper">
      <input type="password" id="password" name="password" placeholder="Enter your password" required>
      <button type="button" class="toggle-pw" onclick="togglePw('password', this)">Show</button>
    </div>
    <div class="field-error" id="pw-error">Password is required.</div>

    <button type="submit" class="btn-primary">Sign In →</button>
  </form>

  <hr class="divider">
  <p class="footer-text">Don't have an account? <a href="register.html">Create one</a></p>
</div>

<script>
  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type === "password" ? "text" : "password";
    btn.textContent = inp.type === "password" ? "Show" : "Hide";
  }
  document.getElementById("email").addEventListener("blur", function () {
    const err = document.getElementById("email-error");
    err.style.display = (!this.value.includes("@") || !this.value.includes(".")) ? "block" : "none";
  });
</script>
<script type="module" src="auth.js"></script>
</body>
</html>
