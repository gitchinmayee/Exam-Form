<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="title_login">Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .toggle-lang-btn {
      display:block; margin: 0 0 14px auto;
      background:#0056b3; color:#fff; border:none;
      border-radius:20px; padding:6px 16px; font-size:0.85rem;
      cursor:pointer; font-weight:bold;
    }
    .password-wrapper { position:relative; margin-bottom:20px; }
    .password-wrapper input { margin-bottom:0; padding-right:44px; }
    .toggle-pw {
      position:absolute; right:10px; top:50%;
      transform:translateY(-50%);
      background:none; border:none; cursor:pointer;
      color:#888; font-size:1rem; padding:0;
    }
    .field-error { color:#c00; font-size:0.8rem; margin:-14px 0 10px; display:none; text-align:left; }
  </style>
</head>
<body>
  <div class="container">
    <button type="button" class="toggle-lang-btn" onclick="toggleLang()" data-i18n="toggle_lang">English</button>

    <h2 data-i18n="title_login">Login</h2>

    <form id="loginForm" novalidate>
      <label for="email" data-i18n="label_email">Email:</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>
      <div class="field-error" id="email-error">Please enter a valid email address.</div>

      <label for="password">Password:</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <button type="button" class="toggle-pw" onclick="togglePw('password', this)" title="Show/Hide password">👁</button>
      </div>
      <div class="field-error" id="pw-error">Password is required.</div>

      <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script>
    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      if (inp.type === "password") { inp.type = "text"; btn.textContent = "🙈"; }
      else { inp.type = "password"; btn.textContent = "👁"; }
    }

    // Inline validation
    document.getElementById("email").addEventListener("blur", function() {
      const err = document.getElementById("email-error");
      err.style.display = !this.value.includes("@") || !this.value.includes(".") ? "block" : "none";
    });
  </script>
  <script type="module" src="auth.js"></script>
</body>
</html>
