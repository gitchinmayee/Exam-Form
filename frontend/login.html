<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="title_login">Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="text-align:right; margin-bottom: 10px;">
      <button type="button" onclick="toggleLang()" data-i18n="toggle_lang" style="padding:5px 14px; border-radius:6px; border:1px solid #ccc; cursor:pointer; background:#f0f0f0; font-size:14px;">English</button>
    </div>
    <h2 data-i18n="title_login">Login</h2>
    
    <form id="loginForm" novalidate>
      <label for="email" data-i18n="label_email">Email:</label>
      <input type="email" id="email" name="email" data-i18n-placeholder="placeholder_email" placeholder="name@example.com" required>

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>

      <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
