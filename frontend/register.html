<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="title_register">Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="text-align:right; margin-bottom: 10px;">
      <button type="button" onclick="toggleLang()" data-i18n="toggle_lang" style="padding:5px 14px; border-radius:6px; border:1px solid #ccc; cursor:pointer; background:#f0f0f0; font-size:14px;">English</button>
    </div>
    <h2 data-i18n="title_register">Register</h2>

    <form id="registerForm" novalidate>
      <label for="reg_email" data-i18n="label_email">Email:</label>
      <input type="email" id="reg_email" name="reg_email" data-i18n-placeholder="placeholder_email" placeholder="name@example.com" required>

      <label for="reg_password">Password:</label>
      <input type="password" id="reg_password" name="reg_password" placeholder="Enter password" required>

      <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
