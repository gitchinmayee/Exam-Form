<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Exam Suit Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2, h3 {
            text-align: center;
            color: #333;
        }
        .form-section {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="date"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .button-group {
            text-align: center;
            margin-top: 20px;
        }
        .button-group button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-button { background-color: #28a745; color: white; }
        .back-button { background-color: #007bff; color: white; }
        .print-button { background-color: #6c757d; color: white; }
        .whatsapp-button { background-color: #25d366; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>पर्यवेक्षक सूट करीता उमेदवाराची माहिती</h2>
    <h3>Supervisor Exam Suit Information</h3>

    <form id="supervisorExamForm" action="/submit-exam-suit" method="post">
        
        <div class="form-section">
            <h3>उमेदवाराची माहिती (Candidate Information)</h3>
            <label for="candidate_name">१. अर्जदाराचे पूर्ण नांव (Name of Candidate)</label>
            <input type="text" id="candidate_name" name="candidate_name" required>

            <label for="father_name">२. उमेदवाराच्या वडिलांचे / पतीचे संपूर्ण नांव (Father's full name)</label>
            <input type="text" id="father_name" name="father_name" required>

            <label for="local_address">३. उमेदवाराचा स्थानिक पत्ता (Local Address of candidate)</label>
            <input type="text" id="local_address" name="local_address" required>

            <label for="mobile_number">४. मोबाईल क्रमांक (Mobile number)</label>
            <input type="tel" id="mobile_number" name="mobile_number" required>

            <label for="email_id">५. ई-मेल पत्ता (Email Id)</label>
            <input type="email" id="email_id" name="email_id" required>

            <label for="adhar_number">६. आधार क्रमांक (Adhar card number)</label>
            <input type="text" id="adhar_number" name="adhar_number" required>

            <label for="pan_number">७. पॅन कार्ड क्रमांक (Pan card number)</label>
            <input type="text" id="pan_number" name="pan_number" required>

            <label for="exam_passed">८. उमेदवार कोणती परीक्षा उत्तीर्ण झाला आहे (उदा: Diploma/Degree or ITI nctvt) (Candidate which Exam passed)</label>
            <input type="text" id="exam_passed" name="exam_passed" required>

            <label for="dob">९. जन्म दिनांक व जन्म ठिकाण (Date of Birth and Birth place)</label>
            <input type="text" id="dob" name="dob" placeholder="उदा. DD/MM/YYYY, Place" required>

            <label for="height">१०. उंची (Height)</label>
            <input type="text" id="height" name="height">

            <label for="identification_mark">११. शरीरावरीक ओळख चिन्हे (Identification mark on body)</label>
            <input type="text" id="identification_mark" name="identification_mark">
        </div>

        <div class="form-section">
            <h3>Information For MCVC candidate only</h3>
            <label for="company_name">१२. ठेकेदाराचे अथवा कंपनीचे नाव (Company/Contractor firm name with MC number)</label>
            <input type="text" id="company_name" name="company_name">

            <label for="joining_date">१३. जॉइनिंग तारीख (Joining date)</label>
            <input type="date" id="joining_date" name="joining_date">

            <label for="service_end_date">१३. सेवा समाप्त तारीख (Service end date)</label>
            <input type="date" id="service_end_date" name="service_end_date">

            <label for="supervisor_name">१४. विद्युत पर्यवेक्षक विद्युत अभियंता यांचे नांव (Supervisor/Electrical Inspector name)</label>
            <input type="text" id="supervisor_name" name="supervisor_name">

            <label for="ms_number">१४. पर्यवेक्षक क्रमांक (Supervisor MS Number)</label>
            <input type="text" id="ms_number" name="ms_number">
            
            <label for="mcvc_joining_date">१५. जॉइनिंग तारीख (Joining date) (for mcvc candidate)</label>
            <input type="date" id="mcvc_joining_date" name="mcvc_joining_date">

            <label for="mcvc_service_end_date">१५. सेवा समाप्त तारीख (Service end date) (for mcvc candidate)</label>
            <input type="date" id="mcvc_service_end_date" name="mcvc_service_end_date">
        </div>

        <div class="button-group">
            <button type="button" class="back-button" onclick="window.location.href='dashboard.html'">← Back to Form Selection</button>
            <button type="submit" class="submit-button">Submit & Pay</button>
        </div>
    </form>
</div>
<script src="lang-toggle.js"></script>
<script src="payment.js"></script>

</body>
</html>
